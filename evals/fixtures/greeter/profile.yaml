id: greeter
display_name: Eval greeter
language: python
validation_profile: standard
allowed_paths:
  - src/**
  - tests/**
forbidden_paths:
  - .env
  - secrets/**
commands:
  test: python3 tests/test_greet.py
secret_scan: true
network:
  allow_package_downloads: false
  allow_external_mutations: false
