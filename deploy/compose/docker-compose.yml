#
# Linux development-host packaging. The Mac inference node stays native.
# Do not publish 11434 or 8741 on a public interface.
# api / scheduler / worker / optional adapter services land in Phase 5.

name: two

services:
  two:
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile
    environment:
      TWO_INFERENCE_PROFILE: ${TWO_INFERENCE_PROFILE:-m24-qwen38-16k}
    volumes:
      - ../../config:/app/config:ro
    # No ports: CLI only until the control API exists.
    profiles: []
