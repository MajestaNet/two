#
# Example TCL Roku television binding (ADR 0029, ADR 0049). Copy to
# $TWO_DATA_DIR/devices/tv.yaml and set enabled: true.
# An install that already has Samsung or LG sets can add a set with
# brand: tcl to that same file. The address is a private IPv4 address.
# There is no token and no MAC. Channel ids come from `two tv apps`.
# The sample id below is not this television. Replace it.
# See docs/setup.md.

enabled: false
brand: tcl
sets:
  living-room:
    # Optional spoken ids for this set. Channel names stay under targets.
    # aliases: [big-tv]
    address: 192.168.1.60
    # Roku ECP is plain HTTP. true is refused.
    secure: false
    volume_min: 0
    volume_max: 30
    volume_step: 3
    targets:
      netflix:
        app_id: "12"
