# Physical placement. The logical split (Ollama vs Majesta Two/DSH) never collapses.
# See docs/adrs/0006-logical-split-physical-colocation.md and
# docs/adrs/0019-mini-resident-control-plane.md.

default: colocated

topologies:
  split:
    recommended_min_unified_memory_gb: 24
    ollama_bind: private-lan-or-overlay
    harness_host: development-host
    notes: >-
      Optional. Use when a second machine stays powered on. The Mac mini
      serves Qwen. Majesta Two and DeepSeek Harness run on that other
      host. Linux Compose is this packaging (ADR 0005).

  colocated:
    recommended_min_unified_memory_gb: 24
    ollama_bind: "127.0.0.1"
    harness_host: same-as-ollama
    notes: >-
      Default (ADR 0019). The Mac mini is the always-on host. Native
      Ollama, Majesta Two, and DeepSeek Harness are separate processes.
      Bind Ollama to loopback. Disable sleep. The installer selects the
      inference profile that fits beside the control plane.
