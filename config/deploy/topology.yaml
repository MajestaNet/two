# Physical placement. The logical split (Ollama vs Majesta Two/DSH) never collapses.
# See docs/adrs/0006-logical-split-physical-colocation.md.

default: split

topologies:
  split:
    recommended_min_unified_memory_gb: 24
    ollama_bind: private-lan-or-overlay
    harness_host: development-host
    notes: >-
      Default. Dedicated Apple Silicon inference appliance. Majesta Two and
      DeepSeek Harness run on a Linux host or workstation. Use this on a
      24 GB Mini and for overnight isolation.

  colocated:
    recommended_min_unified_memory_gb: 48
    ollama_bind: "127.0.0.1"
    harness_host: same-as-ollama
    notes: >-
      Optional. One larger Mac runs native Ollama plus Majesta Two/DSH as
      separate processes. Bind Ollama to loopback only. Disable sleep.
      Not recommended on 24 GB: the model plus builds will swap.
