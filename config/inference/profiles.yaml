#
# Named inference profiles. 24 GB / 16K is the default reference, not a ceiling.
# Each profile names one upstream_model. Live bootstrap pulls that tag only
# (ADR 0023). A different official tag replaces it. Do not keep a second
# weight set. See docs/adrs/0004-inference-profiles.md and docs/setup.md.

default: m24-qwen38-16k

# Native advertised window for these Ollama tags is 262144. Smaller values
# are the soak defaults. The console lists the full set; load still sets
# OLLAMA_CONTEXT_LENGTH to the selected window.
native_ctx: &native_ctx [8192, 16384, 32768, 65536, 131072, 262144]

profiles:
  m16-qwen35-4b:
    min_unified_memory_gb: 16
    recommended_unified_memory_gb: 16
    display_name: Qwen 3.5 4B
    upstream_model: qwen3.5:4b-mlx
    alias: qwen3.5:4b-mlx
    mlx_lm_model: mlx-community/Qwen3.5-4B-MLX-4bit
    num_ctx: 8192
    num_ctx_options: *native_ctx
    kv_cache: q8_0
    flash_attention: true
    notes: >-
      Fits a 16 GB Mac. Served tag is qwen3.5:4b-mlx.
      One loaded model.

  m16-qwen35-small:
    min_unified_memory_gb: 16
    recommended_unified_memory_gb: 16
    display_name: Qwen 3.5 0.8B
    upstream_model: qwen3.5:0.8b-mlx
    alias: qwen3.5:0.8b-mlx
    mlx_lm_model: mlx-community/Qwen3.5-0.8B-4bit
    num_ctx: 8192
    num_ctx_options: *native_ctx
    kv_cache: q8_0
    flash_attention: true
    notes: >-
      Smallest catalog model. Served tag is qwen3.5:0.8b-mlx.
      Use it when the 4B model still swaps.

  m24-qwen38-16k:
    min_unified_memory_gb: 24
    recommended_unified_memory_gb: 24
    display_name: Qwen 3.5 9B
    upstream_model: qwen3.5:9b-mlx
    alias: qwen3.5:9b-mlx
    mlx_lm_model: mlx-community/Qwen3.5-9B-OptiQ-4bit
    num_ctx: 16384
    num_ctx_options: *native_ctx
    kv_cache: q8_0
    flash_attention: true
    notes: >-
      Default profile on a 24 GB Mac. Served tag is qwen3.5:9b-mlx.
      Context comes from OLLAMA_CONTEXT_LENGTH. No second Ollama model.

  m24-qwen38-q3:
    min_unified_memory_gb: 24
    recommended_unified_memory_gb: 24
    display_name: Qwen 3.8 27B Q3
    upstream_model: batiai/qwen3.8-27b:q3
    alias: batiai/qwen3.8-27b:q3
    mlx_lm_model: lukaskremla/Qwen3.8-27B-3bit-MLX-TextOnly
    num_ctx: 8192
    num_ctx_options: *native_ctx
    kv_cache: q8_0
    flash_attention: true
    notes: >-
      Q3 of Qwen 3.8 27B. Smaller than Q4. Try it on a 24 GB Mini.
      Not the recommended profile.

  m24-qwen38-32k:
    min_unified_memory_gb: 24
    recommended_unified_memory_gb: 24
    display_name: Qwen 3.8 27B Q4
    upstream_model: qwen3.8:27b-mlx
    alias: qwen38-agent-32k
    mlx_lm_model: mlx-community/Qwen3.8-27B-OptiQ-4bit
    num_ctx: 32768
    num_ctx_options: *native_ctx
    kv_cache: q8_0
    flash_attention: true
    notes: Official Q4 27B MLX tag. Soak before using unattended.

  m36-qwen38-32k:
    min_unified_memory_gb: 36
    recommended_unified_memory_gb: 36
    display_name: Qwen 3.8 27B Q4
    upstream_model: qwen3.8:27b-mlx
    alias: qwen38-agent-32k
    mlx_lm_model: mlx-community/Qwen3.8-27B-OptiQ-4bit
    num_ctx: 32768
    num_ctx_options: *native_ctx
    kv_cache: q8_0
    flash_attention: true
    notes: Comfortable 32K on a larger Mac. Still one loaded model.

  m48-qwen38-64k:
    min_unified_memory_gb: 48
    recommended_unified_memory_gb: 48
    display_name: Qwen 3.8 27B Q4
    upstream_model: qwen3.8:27b-mlx
    alias: qwen38-agent-64k
    mlx_lm_model: mlx-community/Qwen3.8-27B-OptiQ-4bit
    num_ctx: 65536
    num_ctx_options: *native_ctx
    kv_cache: q8_0
    flash_attention: true
    notes: Starting point only. Measure page-outs and tool-call stability.

  m64-qwen38-plus:
    min_unified_memory_gb: 64
    recommended_unified_memory_gb: 64
    display_name: Qwen 3.8 27B Q4
    upstream_model: qwen3.8:27b-mlx
    alias: qwen38-agent-plus
    mlx_lm_model: mlx-community/Qwen3.8-27B-OptiQ-4bit
    num_ctx: 65536
    num_ctx_options: *native_ctx
    kv_cache: q8_0
    flash_attention: true
    notes: >-
      One upstream tag. A larger official Qwen tag may replace
      upstream_model after a soak. Bootstrap pulls that tag only.
      Do not keep a second weight set.

  custom:
    min_unified_memory_gb: 24
    recommended_unified_memory_gb: 24
    display_name: Custom
    upstream_model: qwen3.8:27b-mlx
    alias: qwen38-agent-custom
    mlx_lm_model: mlx-community/Qwen3.8-27B-OptiQ-4bit
    num_ctx: 16384
    num_ctx_options: *native_ctx
    kv_cache: q8_0
    flash_attention: true
    notes: Operator-defined. Keep official weights. Document the digest in models.lock.
