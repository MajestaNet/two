#
# How clients reach the Majesta Two backend. See docs/channels.md and ADR 0007.

api:
  default_bind: "127.0.0.1"
  default_port: 8741
  allow_public_bind: false
  overlay_interface_example: tailscale0

# No messenger is selected. Slots and enablement: config/adapters/catalog.yaml.
channels:
  required: false
  inbound_http_callbacks: false
  require_allowlists: true

ollama:
  publish_to_clients: false
  bind_public_interface: false
