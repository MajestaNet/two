#
# How clients reach the DevFlow backend. See docs/channels.md and ADR 0007.

api:
  default_bind: "127.0.0.1"
  default_port: 8741
  allow_public_bind: false
  overlay_interface_example: tailscale0

channels:
  required: false
  mvp_adapter: slack
  inbound_http_callbacks: false
  require_allowlists: true

# Slack MVP adapter only. Leave unused if you do not run a messenger.
slack:
  mode: socket

ollama:
  publish_to_clients: false
  bind_public_interface: false
