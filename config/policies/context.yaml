#
# 16K turn budget and compaction (architecture §7.2).
# Token estimates use a character/4 heuristic (see two.context.budget).
# Compaction begins at 72% of declared context (inside the 70–75% range).
# The worker/DSH (B09) applies this policy; B05 only defines it.

declared_context_tokens: 16384
compaction_threshold_ratio: 0.72
token_chars_per_token: 4

budgets:
  system_tool_policy:
    min_tokens: 2000
    max_tokens: 3000
    target_tokens: 2500
  task_memory_and_plan:
    min_tokens: 1000
    max_tokens: 2000
    target_tokens: 1500
  retrieved_code_and_diagnostics:
    min_tokens: 5000
    max_tokens: 7000
    target_tokens: 6000
  reserved_model_output:
    min_tokens: 5000
    max_tokens: 8000
    target_tokens: 6500

retrieval:
  max_files_per_search: 20
  max_lines_per_hit: 12
  max_excerpt_chars: 800
  context_lines: 3
  max_instruction_lines: 40
