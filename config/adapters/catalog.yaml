# Install menu for clients and adapters (ADR 0021).
# Presence in this file does not start a process.
# default_enabled is true only for the CLI.
# selectable is true only when status is shipped.
# Kinds stay separate: client, messenger, device, export.
# two.providers is not a slot in this catalog.

slots:
  cli:
    kind: client
    status: shipped
    package: two.cli
    default_enabled: true
    selectable: true
    harness_profiles:
      - self-build
    notes: >
      Local operator surface. Always on. Submits coding tasks.
      Not a device or messenger process.

  console:
    kind: client
    status: shipped
    package: apps/console
    default_enabled: false
    selectable: true
    harness_profiles:
      - chat
    notes: >
      Local operator window on this Mac (ADR 0031). Default off.
      Starts and stops the control plane, recommends one catalog model,
      and sends chat through the loopback API. Closing the window
      leaves the server running. The iPhone and Apple Watch apps are
      MajestaNet/two-mobile.

  mobile:
    kind: client
    status: contract
    package: two.api
    default_enabled: false
    selectable: false
    harness_profiles:
      - self-build
    notes: >
      API slices for the B14 development-loop GUI live in this repo
      (ADR 0015). That native GUI is not built. OIDC is not accepted
      (ADR 0016). The iPhone and Apple Watch voice apps are
      MajestaNet/two-mobile and use the watch slot, not this one.

  watch:
    kind: client
    status: contract
    package: two.edge
    default_enabled: false
    selectable: false
    harness_profiles:
      - chat
      - home-action
    notes: >
      First-party voice client, not a device adapter (ADR 0020).
      two edge issue writes a private CA. The iPhone and Apple Watch
      apps are MajestaNet/two-mobile. They are not in this repo.
      chat is stored. home-action is stored only when the local
      climate, television, or vacuum binding is enabled. An omitted
      profile is routed (ADR 0030).

  device:
    kind: device
    status: reserved
    package: ""
    default_enabled: false
    selectable: false
    harness_profiles:
      - chat
      - home-action
    notes: >
      Kind-level reservation. Named device packages are separate slots.
      May resume chat or home-action only. Default off on an install.

  climate:
    kind: device
    status: shipped
    package: two.devices.climate
    default_enabled: false
    selectable: true
    harness_profiles:
      - home-action
    notes: >
      Closed climate tools (ADR 0022). Default off. An install enables it
      with $TWO_DATA_DIR/devices/climate.yaml. The transport is Home
      Assistant REST, ECHONET Lite (ADR 0027), or an ESPHome climate
      entity on a shared node (ADR 0043). The model does not call the
      upstream. The control plane performs the read-back.

  tv:
    kind: device
    status: shipped
    package: two.devices.tv
    default_enabled: false
    selectable: true
    harness_profiles:
      - home-action
    notes: >
      Closed television tools (ADR 0029, ADR 0047, ADR 0049). Default off.
      An install enables it with $TWO_DATA_DIR/devices/tv.yaml. A set
      names brand samsung, lg, or tcl. An omitted brand stays samsung.
      One file may mix brands. The model does not call the set. The
      control plane performs the read-back.

  vacuum:
    kind: device
    status: shipped
    package: two.devices.vacuum
    default_enabled: false
    selectable: true
    harness_profiles:
      - home-action
    notes: >
      Closed vacuum tools (ADR 0038). Default off. An install enables it
      with $TWO_DATA_DIR/devices/vacuum.yaml. The transport is the Ecovacs
      Open API. No second brand (ADR 0050). The model does not call that
      API. The control plane performs the read-back. The key stays in
      the environment.

  github:
    kind: export
    status: reserved
    package: ""
    default_enabled: false
    selectable: false
    harness_profiles: []
    notes: >
      Reserved path src/two/export/ (ADR 0012, B17). Not a channel.
      Not created. Approval-gated draft PR export, never a merge.
